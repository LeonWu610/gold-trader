<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#0a0b0e"/>
  <!-- Gold bar shape -->
  <rect x="5" y="12" width="22" height="10" rx="2" fill="#c9a84c"/>
  <rect x="7" y="14" width="18" height="6" rx="1" fill="#e8c96e"/>
  <!-- Shine highlight -->
  <rect x="9" y="15" width="6" height="2" rx="0.5" fill="#f5dea0" opacity="0.7"/>
  <!-- Au text -->
  <text x="16" y="20.5" text-anchor="middle" font-family="Georgia, serif" font-size="6" font-weight="bold" fill="#0a0b0e" letter-spacing="0.5">Au</text>
  <!-- Top signal line (chart-like) -->
  <polyline points="5,10 9,7 13,9 18,5 23,8 27,6" fill="none" stroke="#c9a84c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
