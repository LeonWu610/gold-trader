name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "gold-trader/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Generate gold signal data"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22 自带 npm 10.9+，避开 Node 20 附带 npm 10.8.2 的 ci 进程退出缺陷。
          node-version: 22
          cache: npm
          cache-dependency-path: gold-trader/package-lock.json
      - name: Install dependencies and build static site
        working-directory: gold-trader
        env:
          CI: false
        run: |
          # npm ci 在 GitHub Runner 上会触发 npm 内部的 "Exit handler never called"；
          # 改用 npm install 仍遵循 package.json，并规避该 npm CLI 缺陷。
          npm install --include=dev --no-audit --no-fund
          test -x node_modules/.bin/react-scripts
          npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: gold-trader/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
