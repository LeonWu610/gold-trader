name: Generate gold signal data

on:
  schedule:
    - cron: "15 1,7,13,19 * * 1-5"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "data_fetcher.py"
      - "requirements.txt"
      - ".github/workflows/generate-data.yml"

permissions:
  contents: write

concurrency:
  group: generate-gold-data
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate static market data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
          POLYGON_KEY: ${{ secrets.POLYGON_KEY }}
        run: python -c "from data_fetcher import export_static_data; export_static_data('gold-trader/public/gold_signal.json')"

      - name: Validate generated data
        run: python -c "import json; data = json.load(open('gold-trader/public/gold_signal.json', encoding='utf-8')); assert data.get('timestamp'); assert data.get('data_sources'); assert data.get('signal'); print('Validated:', data['timestamp'])"

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold-trader/public/gold_signal.json
          git diff --cached --quiet || git commit -m "chore: update gold signal data"
          git push
